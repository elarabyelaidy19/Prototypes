<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex &mdash; AI Book Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #faf9f7;
            --bg-raised: #ffffff;
            --bg-surface: #f3f1ee;
            --bg-hover: #edeae6;
            --bg-active: #e8e5e0;
            --border: #e0ddd8;
            --border-subtle: #eae7e2;
            --text: #1a1714;
            --text-secondary: #4a4540;
            --text-muted: #7a756e;
            --accent: #9c6b3a;
            --accent-dim: rgba(156,107,58,0.08);
            --accent-glow: rgba(156,107,58,0.04);
            --user-msg: #9c6b3a;
            --user-msg-text: #ffffff;
            --ai-msg: #f3f1ee;
            --code-bg: #f7f5f2;
            --code-border: #e0ddd8;
            --error: #c4493c;
            --success: #3a8a6a;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --font-display: 'Instrument Serif', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --shadow-float: 0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
            --shadow-glow: 0 0 40px rgba(156,107,58,0.06);
        }

        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ─── Layout ──────────────────────────────────── */
        #app { display: flex; height: 100%; }

        /* ─── Sidebar ─────────────────────────────────── */
        .sidebar {
            width: 280px;
            background: var(--bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-family: var(--font-display);
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-mark {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent), #b8874e);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #ffffff;
            font-weight: 600;
            font-family: var(--font-body);
        }

        /* Upload */
        .upload-zone {
            margin: 16px;
            padding: 24px 16px;
            border: 1.5px dashed var(--border);
            border-radius: var(--radius);
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .upload-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, var(--accent-glow), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .upload-zone:hover, .upload-zone.drop-active {
            border-color: var(--accent);
            background: var(--accent-dim);
        }
        .upload-zone:hover::before, .upload-zone.drop-active::before { opacity: 1; }
        .upload-icon {
            width: 36px;
            height: 36px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
        .upload-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

        /* Book list */
        .book-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
        .book-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }
        .book-item:hover { background: var(--bg-hover); }
        .book-item.active { background: var(--bg-active); }
        .book-cover {
            width: 36px;
            height: 50px;
            border-radius: 4px;
            background: var(--bg-surface);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-subtle);
        }
        .book-cover img { width: 100%; height: 100%; object-fit: cover; }
        .book-cover svg { width: 18px; height: 18px; color: var(--text-muted); }
        .book-meta { min-width: 0; flex: 1; }
        .book-title-item {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-author-item {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .book-delete {
            opacity: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .book-item:hover .book-delete { opacity: 1; }
        .book-delete:hover { color: var(--error); background: rgba(196,73,60,0.08); }
        .empty-list { text-align: center; color: var(--text-muted); font-size: 13px; padding: 32px 16px; }

        /* ─── Reader Area ─────────────────────────────── */
        .reader-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        /* Toolbar */
        .reader-toolbar {
            height: 48px;
            background: var(--bg-raised);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 4px;
            flex-shrink: 0;
        }
        .reader-toolbar.hidden { display: none; }
        .tb-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .tb-btn:hover { background: var(--bg-hover); color: var(--text); }
        .tb-btn:disabled { opacity: 0.25; pointer-events: none; }
        .tb-btn.active { color: var(--accent); background: var(--accent-dim); }
        .tb-spacer { flex: 1; }
        .page-info {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            min-width: 110px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .book-title-bar {
            font-family: var(--font-display);
            font-size: 15px;
            color: var(--text);
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-style: italic;
        }

        /* Welcome screen */
        .welcome {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .welcome-inner {
            text-align: center;
            max-width: 380px;
            padding: 40px;
        }
        .welcome-glyph {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--accent-dim), transparent);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }
        .welcome h2 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            font-weight: 400;
        }
        .welcome-keys {
            margin-top: 20px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .key-tag {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            font-family: var(--font-mono);
        }

        /* Reader panels */
        .reader-panel {
            flex: 1;
            overflow: auto;
            display: none;
        }
        .reader-panel.visible { display: flex; }
        #pdf-reader { justify-content: center; align-items: flex-start; padding: 32px; }
        .pdf-page-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: 100%;
        }
        .pdf-page-wrapper img {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 120px);
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        #pdf-text-layer {
            position: absolute;
            top: 0; left: 0;
            overflow: hidden;
            border-radius: var(--radius-sm);
        }
        #pdf-text-layer span {
            position: absolute;
            color: transparent;
            white-space: pre;
            line-height: 1;
            cursor: text;
            user-select: text;
        }
        #pdf-text-layer span::selection {
            background: rgba(156, 107, 58, 0.3);
        }
        #pdf-text-layer span::-moz-selection {
            background: rgba(156, 107, 58, 0.3);
        }
        #pdf-text-view, #epub-reader { display: none; overflow-y: auto; }
        #pdf-text-view.visible, #epub-reader.visible { display: block; }
        .book-content {
            font-family: var(--font-display);
            font-size: 1.2rem;
            line-height: 1.85;
            color: var(--text);
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 32px 80px;
        }
        .book-content h1 {
            font-family: var(--font-display);
            font-size: 1.8em;
            font-weight: 400;
            margin: 1.4em 0 0.5em;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .book-content h2 {
            font-family: var(--font-display);
            font-size: 1.4em;
            font-weight: 400;
            margin: 1.2em 0 0.4em;
            color: var(--text);
        }
        .book-content h3 {
            font-family: var(--font-display);
            font-size: 1.15em;
            font-weight: 400;
            margin: 1em 0 0.3em;
            color: var(--text);
        }
        .book-content p {
            margin: 0 0 0.7em;
            text-align: justify;
            hyphens: auto;
        }
        .book-content strong { font-weight: 700; }
        .book-content em { font-style: italic; }
        .book-content code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            padding: 1px 5px;
            border-radius: 4px;
        }
        .book-content .text-gap {
            height: 0.8em;
        }
        .book-content img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }

        /* ─── Chat Sidebar (resizable) ────────────────── */
        .chat-sidebar {
            width: 33vw;
            min-width: 33vw;
            max-width: 50vw;
            background: var(--bg-raised);
            border-left: 1px solid var(--border);
            display: none;
            flex-direction: column;
            flex-shrink: 0;
            position: relative;
        }
        .chat-sidebar.visible { display: flex; }

        /* Resize handle */
        .resize-handle {
            position: absolute;
            top: 0;
            left: -4px;
            width: 8px;
            height: 100%;
            cursor: col-resize;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .resize-handle::after {
            content: '';
            width: 3px;
            height: 32px;
            border-radius: 3px;
            background: var(--border);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .resize-handle:hover::after,
        .resize-handle.dragging::after {
            opacity: 1;
            background: var(--accent);
        }
        body.resizing { cursor: col-resize !important; user-select: none !important; }
        body.resizing * { cursor: col-resize !important; user-select: none !important; }

        /* Chat tabs */
        .chat-tabs {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .clear-chat-btn {
            padding: 8px 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            flex-shrink: 0;
        }
        .clear-chat-btn:hover { color: var(--accent); }
        .chat-tab {
            flex: 1;
            padding: 14px 0;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-align: center;
            color: var(--text-secondary);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chat-tab:hover { color: var(--text-secondary); }
        .chat-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Selected text preview */
        .selection-preview {
            padding: 14px 16px;
            background: #f5ede4;
            border-bottom: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            display: none;
        }
        .selection-preview.visible { display: block; }
        .selection-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 8px;
        }
        .selection-text {
            font-family: var(--font-body);
            font-style: normal;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg-row { display: flex; }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.ai { justify-content: flex-start; }
        .msg-row.system { justify-content: center; }

        .msg-bubble {
            max-width: 88%;
            font-size: 14px;
            line-height: 1.7;
        }
        .msg-user {
            background: var(--accent);
            color: var(--user-msg-text);
            padding: 10px 16px;
            border-radius: 18px 18px 4px 18px;
            font-weight: 500;
        }
        .msg-ai {
            background: var(--bg-surface);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 4px 18px 18px 18px;
            border: 1px solid var(--border);
            font-weight: 400;
        }
        .msg-system {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        /* ─── Markdown in AI messages ─────────────────── */
        .msg-ai p { margin: 0 0 0.6em; }
        .msg-ai p:last-child { margin-bottom: 0; }
        .msg-ai strong { font-weight: 700; color: var(--text); }
        .msg-ai em { font-style: italic; color: var(--text); }
        .msg-ai ul, .msg-ai ol { margin: 0.4em 0 0.6em 1.4em; }
        .msg-ai li { margin-bottom: 0.25em; }
        .msg-ai blockquote {
            border-left: 3px solid var(--accent);
            padding: 4px 0 4px 14px;
            margin: 0.5em 0;
            color: var(--text-secondary);
            font-style: italic;
        }
        .msg-ai h1, .msg-ai h2, .msg-ai h3 {
            font-weight: 600;
            margin: 0.8em 0 0.3em;
            color: var(--text);
        }
        .msg-ai h1 { font-size: 1.15em; }
        .msg-ai h2 { font-size: 1.05em; }
        .msg-ai h3 { font-size: 1em; }

        /* Inline code */
        .msg-ai code:not(.code-block-code) {
            font-family: var(--font-mono);
            font-size: 0.85em;
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            padding: 1px 6px;
            border-radius: 4px;
            color: var(--accent);
        }

        /* Code blocks */
        .code-block {
            margin: 10px 0;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--code-border);
            background: var(--code-bg);
        }
        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--code-border);
        }
        .code-block-lang {
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        .code-block-copy {
            font-size: 10px;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: var(--font-body);
            transition: all 0.15s;
        }
        .code-block-copy:hover { color: var(--accent); background: var(--accent-dim); }
        .code-block-code {
            font-family: var(--font-mono) !important;
            font-size: 12.5px;
            line-height: 1.6;
            padding: 14px 16px;
            overflow-x: auto;
            color: var(--text);
            background: none !important;
            border: none !important;
            white-space: pre;
            display: block;
        }
        /* Syntax colors */
        .tok-kw { color: #9c6b3a; }
        .tok-str { color: #3a8a6a; }
        .tok-num { color: #8b5dc8; }
        .tok-cm { color: #a09a94; font-style: italic; }
        .tok-fn { color: #2a6fa8; }
        .tok-op { color: #6b6560; }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingPulse 1.4s ease-in-out infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingPulse {
            0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* Chat input area */
        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }
        .chat-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .chat-input {
            flex: 1;
            height: 40px;
            padding: 0 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            font-size: 13px;
            font-family: var(--font-body);
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input::placeholder { color: var(--text-muted); font-weight: 400; }
        .chat-input:focus { border-color: var(--accent); }
        .send-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--accent);
            color: var(--bg);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .send-btn:hover { filter: brightness(1.1); transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.3; pointer-events: none; }

        /* ─── Selection Toolbar (floating) ────────────── */
        .sel-toolbar {
            position: fixed;
            z-index: 100;
            display: none;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
            gap: 2px;
            box-shadow: var(--shadow-float);
            animation: selFloat 0.15s ease-out;
        }
        .sel-toolbar.visible { display: flex; }
        @keyframes selFloat {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sel-btn {
            padding: 7px 14px;
            border: none;
            background: none;
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-body);
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .sel-btn:hover { background: var(--bg-hover); color: var(--accent); }
        .sel-btn svg { width: 14px; height: 14px; }

        /* Upload overlay */
        .upload-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .upload-overlay.visible { display: flex; }
        .upload-modal {
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            text-align: center;
            box-shadow: var(--shadow-glow);
        }
        .upload-spinner {
            width: 32px;
            height: 32px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Hidden utility */
        .hidden { display: none !important; }

        /* Subtle grain texture on body */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- ─── Left Sidebar ──────────────────────────── -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-mark">C</div>
                    Codex
                </div>
            </div>

            <div id="upload-zone" class="upload-zone">
                <div class="upload-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="color:var(--text-muted)"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
                </div>
                <div class="upload-label">Drop PDF or EPUB</div>
                <div class="upload-hint">or click to browse</div>
                <input type="file" id="file-input" accept=".pdf,.epub" class="hidden">
            </div>

            <div id="book-list" class="book-list"></div>
        </aside>

        <!-- ─── Center: Reader ────────────────────────── -->
        <main class="reader-area">
            <div id="reader-toolbar" class="reader-toolbar hidden">
                <button id="btn-prev" class="tb-btn" disabled title="Previous">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
                </button>
                <span id="page-info" class="page-info"></span>
                <button id="btn-next" class="tb-btn" disabled title="Next">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
                </button>
                <div class="tb-spacer"></div>
                <span id="book-title-bar" class="book-title-bar"></span>
                <div class="tb-spacer"></div>
                <button id="btn-text-toggle" class="tb-btn" title="Text View">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12"/></svg>
                </button>
                <button id="btn-chat-toggle" class="tb-btn" title="AI Chat">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z"/></svg>
                </button>
            </div>

            <!-- Welcome -->
            <div id="welcome-screen" class="welcome">
                <div class="welcome-inner">
                    <div class="welcome-glyph">
                        <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24" style="color:var(--accent)"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    </div>
                    <h2>Your reading companion</h2>
                    <p>Upload a PDF or EPUB to begin. Select text to question it, or converse with the author directly.</p>
                    <div class="welcome-keys">
                        <span class="key-tag">.pdf</span>
                        <span class="key-tag">.epub</span>
                        <span class="key-tag">AI-powered</span>
                    </div>
                </div>
            </div>

            <!-- PDF image view -->
            <div id="pdf-reader" class="reader-panel">
                <div class="pdf-page-wrapper">
                    <img id="pdf-page-img" alt="PDF page">
                    <div id="pdf-text-layer"></div>
                </div>
            </div>

            <!-- PDF text view -->
            <div id="pdf-text-view" class="reader-panel">
                <div id="pdf-text-content" class="book-content"></div>
            </div>

            <!-- EPUB reader -->
            <div id="epub-reader" class="reader-panel">
                <div id="epub-frame" class="book-content"></div>
            </div>
        </main>

        <!-- ─── Right Sidebar: AI Chat ────────────────── -->
        <aside id="chat-sidebar" class="chat-sidebar">
            <div id="resize-handle" class="resize-handle"></div>
            <div class="chat-tabs">
                <button id="tab-qa" class="chat-tab active">Ask about text</button>
                <button id="tab-author" class="chat-tab">Talk to author</button>
                <button id="btn-clear-chat" class="clear-chat-btn" title="Clear chat history">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
                </button>
            </div>

            <div id="selected-text-preview" class="selection-preview">
                <div class="selection-label">Selected passage</div>
                <div id="selected-text-content" class="selection-text"></div>
            </div>

            <div id="chat-messages" class="chat-messages"></div>

            <div class="chat-input-area">
                <div class="chat-input-row">
                    <input id="chat-input" type="text" class="chat-input" placeholder="Ask a question..." autocomplete="off">
                    <button id="btn-send" class="send-btn" disabled>
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Selection floating toolbar -->
    <div id="selection-toolbar" class="sel-toolbar">
        <button id="sel-ask" class="sel-btn">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"/></svg>
            Ask AI
        </button>
        <button id="sel-author" class="sel-btn">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/></svg>
            Ask Author
        </button>
    </div>

    <!-- Upload overlay -->
    <div id="upload-overlay" class="upload-overlay">
        <div class="upload-modal">
            <div class="upload-spinner"></div>
            <div style="font-size:13px;color:var(--text-secondary)">Processing book...</div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
